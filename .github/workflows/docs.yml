name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation tools
        run: python -m pip install -r docs/requirements.txt
      - name: Build and validate site
        run: python -m mkdocs build --strict
      - name: Install browser build prerequisites
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Set up Rust for WebAssembly
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Install matching wasm-bindgen CLI
        run: |
          version=$(python -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build browser application
        run: ./scripts/build-web.sh
      - name: Add application to Pages site
        run: cp -R target/web target/docs-site/app
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser test tools
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Smoke test hosted application
        run: |
          mkdir -p target/pages-preview
          ln -s "$PWD/target/docs-site" target/pages-preview/rgate
          python -m http.server 8080 --bind 127.0.0.1 --directory target/pages-preview > /tmp/rgate-pages.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          RGATE_WEB_URL=http://127.0.0.1:8080/rgate/app/ node web/pages-smoke.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: target/docs-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
